services:
  immich-llm-tagger:
    image: ghcr.io/poweredbypassion/immich-llm-tagger:latest
    ports:
      - "${TAGGER_BIND_ADDRESS:-127.0.0.1}:8080:8080"
    user: "${TAGGER_UID:-10001}:${TAGGER_GID:-10001}"
    volumes:
      - ./data:/data
    # 让容器能用 host.docker.internal 访问宿主机。
    # Linux 上 Docker 默认**不**注入这个名字，必须显式映射到宿主机网桥地址。
    #
    # 为什么需要：LLM / Immich 若跑在宿主机上（例如 http://127.0.0.1:7863），
    # 容器里**必须**写 http://host.docker.internal:7863。
    # 写 127.0.0.1 会打到容器自己 —— 表现为 `[Errno 111] Connection refused`。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      IMMICH_URL: ${IMMICH_URL:-}
      IMMICH_API_KEY: ${IMMICH_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      TAGGER_BIND_ADDRESS: ${TAGGER_BIND_ADDRESS:-127.0.0.1}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-}
    command:
      - /bin/sh
      - -ec
      - |
        case "$${TAGGER_BIND_ADDRESS}" in
          127.0.0.1) ;;
          *)
            if [ -z "$${AUTH_PASSWORD}" ]; then
              echo "Set AUTH_PASSWORD before publishing Tagger on a non-loopback address." >&2
              exit 1
            fi
            ;;
        esac
        exec uvicorn app.web.app:create_app --factory --host 0.0.0.0 --port 8080
    restart: unless-stopped
