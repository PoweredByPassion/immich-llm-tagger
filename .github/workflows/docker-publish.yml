name: Publish Docker image

# 触发时机：
#   - push 到默认分支（main / master）→ 覆盖 :latest 与分支名 tag
#   - push 形如 v1.2.3 的 tag        → 覆盖 :1.2.3 / :1.2 / :latest
#   - 手动触发（Actions 页面 Run workflow）
on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # github.repository 形如 PoweredByPassion/immich-llm-tagger。
  # docker/metadata-action 会自动转小写，满足 GHCR 镜像名必须全小写的约束。
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # 用内置 GITHUB_TOKEN 推送到 ghcr.io 需要 packages: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Dockerfile 用了 BuildKit 的 --mount=type=cache，这里用 gha 缓存
          # 在 CI 之间复用 pip / tailwind 下载结果，避免每次全量重建。
          cache-from: type=gha
          cache-to: type=gha,mode=max
