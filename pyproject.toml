[project]
name = "immich-llm-tagger"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "jinja2>=3.1",
    "Pillow>=10.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "openapi-python-client>=0.29.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# 迁移 .sql、模板、静态文件都必须打进 wheel，
# 否则非 editable 安装后 MIGRATIONS_DIR / TEMPLATES_DIR 会是空的，启动即崩
[tool.setuptools.package-data]
"app.db" = ["migrations/*.sql"]
"app.web" = ["templates/**/*.html", "static/*", "static/img/*"]
