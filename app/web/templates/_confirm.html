{# 二次确认弹层 partial：Alpine 控制显隐，供 hx-sse / 表单触发。
   用法：外层容器设 x-data="{ confirmOpen: false }"，触发处 @click="confirmOpen = true"，
   确认按钮自身加 @click="confirmOpen = false" 再执行实际动作。 #}
<div x-show="confirmOpen" x-cloak
     class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm px-4"
     role="dialog" aria-modal="true">
  <div class="w-full max-w-sm rounded-[6px] border border-[#20232d] bg-[#13151c] p-5 shadow-2xl">
    <h2 class="mb-2 text-sm font-medium text-[#f1f3f9]">{{ confirm_title | default(tr("confirm.default_title")) }}</h2>
    <p class="mb-5 text-xs text-[#8a8f98] leading-relaxed">{{ confirm_body | default(tr("confirm.default_body")) }}</p>
    <div class="flex justify-end gap-2">
      <button type="button" @click="confirmOpen = false"
              class="btn btn-secondary text-xs h-8 px-3">
        {{ tr("config.common.cancel") }}
      </button>
      <button type="button" @click="confirmOpen = false"
              class="btn btn-danger bg-red-500 hover:bg-red-400 text-xs h-8 px-3">
        {{ confirm_label | default(tr("config.common.confirm")) }}
      </button>
    </div>
  </div>
</div>
