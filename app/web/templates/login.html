<!DOCTYPE html>
<html lang="{{ 'zh-CN' if lang() == 'zh' else 'en' }}" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ tr("auth.title") }} · Immich LLM Tagger</title>
  <link rel="icon" type="image/png" href="/static/img/favicon.png">
  <link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png">
  <link rel="stylesheet" href="/static/tailwind.css">
</head>
<body class="min-h-[100dvh] bg-[#090a0f] text-zinc-100 antialiased font-sans flex items-center justify-center p-4">

  <div class="w-full max-w-sm">
    <div class="flex flex-col items-center mb-6">
      <img src="/static/img/logo.svg" alt="Immich LLM Tagger Logo"
           class="w-12 h-12 rounded-xl object-cover aspect-square shadow-sm">
      <div class="mt-3 text-lg font-semibold tracking-tight text-zinc-100">Immich LLM Tagger</div>
      <div class="text-xs text-zinc-400 font-mono mt-0.5">{{ tr("auth.title") }}</div>
    </div>

    <form method="post" action="/login"
          class="bg-[#0d0f14] border border-[#20232d] rounded-lg p-6 space-y-4">
      <div>
        <label for="password" class="block text-sm text-zinc-300 mb-1.5">{{ tr("auth.password") }}</label>
        <input id="password" name="password" type="password" autofocus required
               autocomplete="current-password"
               class="w-full px-3 py-2 rounded bg-[#13151c] border border-[#20232d] text-zinc-100 text-sm focus:outline-none focus:border-[#5e6ad2]">
      </div>

      {% if error %}
      <div class="text-sm text-rose-300" role="alert">{{ error }}</div>
      {% endif %}

      <button type="submit"
              class="w-full py-2 bg-[#5e6ad2] hover:bg-[#6f7be8] active:scale-[0.98] text-white text-sm font-medium rounded transition shadow-sm">
        {{ tr("auth.submit") }}
      </button>
    </form>
  </div>

</body>
</html>
