{# 人工改判结果：刷新状态块 + 覆盖确认（manual_override=true 时二次确认文案）#}
{% if ok %}
<div class="rounded-[10px] border border-emerald-500/40 bg-emerald-500/10 px-4 py-3 text-sm text-emerald-300">
  {{ tr("assets.override.done") }}
</div>
<div class="mt-4">
  {% include "assets/_state_block.html" %}
</div>
<div class="mt-4" x-data="{ confirmOpen: false }">
  <button type="button" @click="confirmOpen = true"
          class="rounded-[10px] border border-amber-500/40 bg-amber-500/10 px-4 py-2 text-sm font-medium text-amber-300 hover:bg-amber-500/20">
    {{ tr("assets.override.cancel_button") }}
  </button>
  <div x-show="confirmOpen" x-cloak
       class="fixed inset-0 z-50 flex items-center justify-center bg-zinc-950/70 px-4"
       role="dialog" aria-modal="true">
    <div class="w-full max-w-sm rounded-[10px] border border-zinc-700 bg-zinc-900 p-5">
      <h2 class="mb-2 text-base font-semibold text-zinc-100">{{ tr("assets.detail.override_clear_title") }}</h2>
      <p class="mb-5 text-sm text-zinc-300">{{ tr("assets.detail.override_clear_body") }}</p>
      <div class="flex justify-end gap-2">
        <button type="button" @click="confirmOpen = false"
                class="rounded-[10px] border border-zinc-700 px-4 py-2 text-sm font-medium text-zinc-300 hover:border-zinc-500">{{ tr("common.back") }}</button>
        <button type="button" @click="confirmOpen = false"
                hx-post="/assets/{{ asset_id }}/override/clear" hx-target="#review-result" hx-swap="innerHTML"
                class="rounded-[10px] bg-amber-500 px-4 py-2 text-sm font-medium text-zinc-950 hover:bg-amber-400">{{ tr("assets.detail.confirm_override_clear") }}</button>
      </div>
    </div>
  </div>
</div>
{% else %}
<div class="rounded-[10px] border border-red-500/40 bg-red-500/10 px-4 py-3 text-sm text-red-300">
  {{ message }}
</div>
{% endif %}
