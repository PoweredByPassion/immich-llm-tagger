{% set lang_options = [("zh", "中文"), ("en", "English"), ("ru", "Русский")] %}
<div x-data="{ open: false }" @click.outside="open = false" @keydown.escape.window="open = false"
     class="relative {{ lang_switch_class | default('') }}">
  <button type="button" @click="open = !open" :aria-expanded="open.toString()" aria-haspopup="listbox"
          class="flex w-full items-center justify-between gap-2 rounded border border-[#20232d] bg-[#181b24] px-2.5 py-1.5 text-xs font-medium text-zinc-300 transition hover:bg-[#13151c] hover:text-white">
    <span class="flex items-center gap-2">
      <svg width="14" height="14" class="h-3.5 w-3.5 flex-shrink-0 text-zinc-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 21a9 9 0 100-18 9 9 0 000 18zm0 0c2.5-2.4 3.75-5.4 3.75-9S14.5 5.4 12 3m0 18c-2.5-2.4-3.75-5.4-3.75-9S9.5 5.4 12 3M3.5 9h17M3.5 15h17" />
      </svg>
      {% for code, label in lang_options %}{% if lang() == code %}<span>{{ label }}</span>{% endif %}{% endfor %}
    </span>
    <svg width="14" height="14" class="h-3.5 w-3.5 flex-shrink-0 text-zinc-400 transition-transform" :class="open && 'rotate-180'" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="{% if lang_switch_dropup | default(true) %}M5 15l7-7 7 7{% else %}M19 9l-7 7-7-7{% endif %}" />
    </svg>
  </button>
  <div x-show="open" x-cloak x-transition.opacity.duration.100ms role="listbox"
       class="absolute left-0 right-0 z-50 overflow-hidden rounded border border-[#20232d] bg-[#13151c] py-1 shadow-2xl {% if lang_switch_dropup | default(true) %}bottom-full mb-1{% else %}top-full mt-1{% endif %}">
    {% for code, label in lang_options %}
    <button type="button" role="option" aria-selected="{{ 'true' if lang() == code else 'false' }}"
            onclick="document.cookie='lang={{ code }};path=/;max-age=31536000';location.reload()"
            class="flex w-full items-center justify-between px-2.5 py-1.5 text-left text-xs transition {% if lang() == code %}text-white font-medium bg-[#181b24]{% else %}text-zinc-300 hover:bg-[#181b24] hover:text-white{% endif %}">
      <span>{{ label }}</span>
      {% if lang() == code %}
      <svg width="14" height="14" class="h-3.5 w-3.5 flex-shrink-0 text-[#8f9bff]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
      </svg>
      {% endif %}
    </button>
    {% endfor %}
  </div>
</div>
