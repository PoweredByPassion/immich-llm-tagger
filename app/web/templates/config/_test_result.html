{% if ok %}
<div class="rounded-[6px] border border-emerald-500/30 bg-emerald-500/10 px-4 py-3 text-xs font-medium text-emerald-300" role="status" data-test-ok="1">{{ message }}</div>
{% else %}
<div class="rounded-[6px] border border-rose-500/30 bg-rose-500/10 px-4 py-3 text-xs font-medium text-rose-300" role="alert" data-test-ok="0">{{ message }}</div>
{% endif %}
